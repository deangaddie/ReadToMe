[install]
# Refuse any version published less than 7 days ago (604800 s; Bun 1.4 takes seconds only).
# It acts only when Bun resolves a version (bun add, bun update, a changed package.json);
# `bun install --frozen-lockfile` of the current lock is unaffected.
# A security fix that needs a younger version overrides it for that one bump, after the
# pre-merge review: bun add <pkg>@<version> --minimum-release-age=0
minimumReleaseAge = 604800
