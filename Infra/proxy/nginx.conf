# read2me-proxy: the only container on an ordinary network. It publishes the five AI service
# ports on 127.0.0.1 and forwards each, as raw TCP, to its service on that service's internal
# network (Infra/README.md, "Container egress").
#
# Upstreams resolve per connection (a variable proxy_pass through Docker's embedded DNS), so a
# stopped service never stops the proxy starting or serving the others. Only one GPU service
# runs at a time.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

stream {
    # Docker's embedded DNS; valid=10s so a recreated container's new address is picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # A llama model switch (autoload) and an audio.cpp busy period are long and silent.
    proxy_connect_timeout 5s;
    proxy_timeout 900s;

    server {
        listen 8080;
        set $upstream llama:8080;
        proxy_pass $upstream;
    }

    server {
        listen 8004;
        set $upstream audiocpp:8080;
        proxy_pass $upstream;
    }

    server {
        listen 9000;
        set $upstream whisper:8080;
        proxy_pass $upstream;
    }

    server {
        listen 8200;
        set $upstream minilm-l6:8200;
        proxy_pass $upstream;
    }

    server {
        listen 8201;
        set $upstream mpnet-base-v2:8201;
        proxy_pass $upstream;
    }
}
