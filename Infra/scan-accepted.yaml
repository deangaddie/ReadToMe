# Accepted findings for scripts/scan-images.ps1, in Trivy's .trivyignore.yaml format.
# Accepted findings still print, in their own section; -All ignores this file.
#
# Each entry: the id, purls that scope it (no version = that distro's package in any
# version; a version = only that build), and a statement holding the reason and the review
# condition. Delete an entry once its condition is met. Triage history: Infra/README.md,
# Security sweep.

# Debian 13 binary packages in the python:3.13-slim base (minilm-l6, mpnet-base-v2).
x-util-linux: &util-linux
  - pkg:deb/debian/bsdutils
  - pkg:deb/debian/libblkid1
  - pkg:deb/debian/liblastlog2-2
  - pkg:deb/debian/libmount1
  - pkg:deb/debian/libsmartcols1
  - pkg:deb/debian/libuuid1
  - pkg:deb/debian/login
  - pkg:deb/debian/mount
  - pkg:deb/debian/util-linux
x-ncurses: &ncurses
  - pkg:deb/debian/libncursesw6
  - pkg:deb/debian/libtinfo6
  - pkg:deb/debian/ncurses-base
  - pkg:deb/debian/ncurses-bin
x-systemd: &systemd
  - pkg:deb/debian/libsystemd0
  - pkg:deb/debian/libudev1

vulnerabilities:
  # Similarity images: Debian has no fix. These are login, mount, terminal and init paths
  # that a single-process FastAPI container never runs.
  - id: CVE-2026-76642
    purls: *util-linux
    statement: &debian-no-fix >-
      Debian 13 has no fix; the similarity containers never run login, mount, terminal or
      init code. Review at each python:3.13-slim digest move; delete once Debian ships a fix.
  - id: CVE-2026-78408
    purls: *util-linux
    statement: *debian-no-fix
  - id: CVE-2026-78409
    purls: *util-linux
    statement: *debian-no-fix
  - id: CVE-2026-78410
    purls: *util-linux
    statement: *debian-no-fix
  - id: CVE-2025-69720
    purls: *ncurses
    statement: *debian-no-fix
  - id: CVE-2026-16742
    purls: *systemd
    statement: *debian-no-fix
  - id: CVE-2026-54369
    purls:
      - pkg:deb/debian/libacl1
    statement: *debian-no-fix
  - id: CVE-2026-9538
    purls:
      - pkg:deb/debian/perl-base
    statement: *debian-no-fix

  # Similarity images: Debian has no fix, and the uvicorn process never maps libsqlite3
  # (checked against /proc/1/maps on both services, #324). Only Python's sqlite3 module
  # loads it, and neither app.py nor its locked dependencies import that module.
  - id: CVE-2026-119373
    purls: &sqlite
      - pkg:deb/debian/libsqlite3-0
    statement: &sqlite-unloaded >-
      Debian 13 has no fix; the similarity services never load libsqlite3 (no sqlite3 import
      at runtime). Review at each python:3.13-slim digest move, and whenever a lock bump
      adds a dependency; delete once Debian ships a fix.
  - id: CVE-2026-119374
    purls: *sqlite
    statement: *sqlite-unloaded
  - id: CVE-2026-119379
    purls: *sqlite
    statement: *sqlite-unloaded

  # audio.cpp: a third-party image, so only its digest can move. Versioned purls, so the
  # entries stop matching once the image ships a newer openssl.
  - id: CVE-2026-45447
    purls: &audiocpp-openssl
      - pkg:deb/ubuntu/openssl@3.0.13-0ubuntu3.9
      - pkg:deb/ubuntu/libssl3t64@3.0.13-0ubuntu3.9
    statement: &audiocpp-unreachable >-
      Unreachable in audio.cpp: audiocpp_server and its libraries don't link libssl or
      libcrypto (only curl for the localhost health check, and python, do), and the highs need
      PKCS#7/S-MIME verification or DTLS. Review at each audio.cpp pin move.
  - id: CVE-2026-84782
    purls: *audiocpp-openssl
    statement: *audiocpp-unreachable

  # Proxy (nginx-unprivileged 1.30.6, Alpine 3.24): no rebuilt image yet; 1.30-alpine-slim
  # and 1.31-alpine-slim were both last built 2026-10-19. Versioned purls, so the entries stop
  # matching once refresh-pins.ps1 moves the digest to a fixed build.
  - id: CVE-2026-113425
    purls: &proxy-nginx
      - pkg:apk/alpine/nginx@1.30.6-r1
    statement: &proxy-unconfigured >-
      Unreachable in the proxy: proxy/nginx.conf has only a stream block (no mail, http,
      HTTP/2, HTTP/3 or TLS). Review at each proxy digest move; delete once the image ships
      nginx 1.30.7.
  - id: CVE-2026-121810
    purls: *proxy-nginx
    statement: *proxy-unconfigured
  - id: CVE-2026-123007
    purls: *proxy-nginx
    statement: *proxy-unconfigured
  - id: CVE-2026-123633
    purls: *proxy-nginx
    statement: *proxy-unconfigured
  - id: CVE-2026-118899
    purls: *proxy-nginx
    statement: *proxy-unconfigured
  # The resolver is in use, but it asks only Docker's embedded DNS (127.0.0.11) for the five
  # service names, and that server forwards nothing out (dns: 127.0.0.1).
  - id: CVE-2026-123634
    purls: *proxy-nginx
    statement: >-
      The proxy's resolver queries only Docker's embedded DNS for five compose service names;
      a crafted answer needs control of the Docker engine. Review at each proxy digest move;
      delete once the image ships nginx 1.30.7.
  - id: CVE-2026-107891
    purls:
      - pkg:apk/alpine/musl@1.2.6-r2
      - pkg:apk/alpine/musl-utils@1.2.6-r2
    statement: >-
      musl regcomp is unused: nginx compiles regexes with PCRE2, and the proxy's config has
      none. Review at each proxy digest move; delete once the image ships musl 1.2.6-r3.
  - id: CVE-2026-85091
    purls:
      - pkg:apk/alpine/zlib@1.3.2-r0
    statement: >-
      gz_vacate is gzip file writing; the stream-only proxy compresses nothing. Review at each
      proxy digest move; delete once the image ships zlib 1.3.2-r1.
