services:
  llama:
    build:
      context: .
      dockerfile: Dockerfile.llama
      target: runtime
    image: read2me-llama
    container_name: read2me-llama
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro
      - ./llama/config:/config:ro
      - ./logs:/logs
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock: -1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      LLAMA_HOST: 0.0.0.0
      LLAMA_PORT: 8080
      LLAMA_MODELS_FILE: /config/models.ini
      LLAMA_DEFAULT_MODEL: gemma-26b

  chatterbox:
    build:
      context: .
      dockerfile: Dockerfile.chatterbox
    image: read2me-chatterbox
    container_name: read2me-chatterbox
    ports:
      - "8000:8000"
    environment:
      - HF_HOME=/cache
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    volumes:
      - ./cache/chatterbox:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  chatterbox-turbo:
    build:
      context: .
      dockerfile: Dockerfile.chatterbox
      args:
        APP_MODULE: app_turbo
    image: read2me-chatterbox-turbo
    container_name: read2me-chatterbox-turbo
    ports:
      - "8001:8000"
    environment:
      - HF_HOME=/cache
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    volumes:
      - ./cache/chatterbox-turbo:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  qwen3-tts:
    build:
      context: .
      dockerfile: Dockerfile.qwen3
    image: read2me-qwen3-tts
    container_name: read2me-qwen3-tts
    ports:
      - "8100:8100"
    environment:
      - HF_HOME=/cache
    volumes:
      - ./cache/qwen3:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  qwen3-tts-base:
    build:
      context: .
      dockerfile: Dockerfile.qwen3
      args:
        APP_MODULE: app_base
        APP_PORT: "8101"
    image: read2me-qwen3-tts-base
    container_name: read2me-qwen3-tts-base
    ports:
      - "8101:8101"
    environment:
      - HF_HOME=/cache
      - APP_PORT=8101
    volumes:
      - ./cache/qwen3-base:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  voxcpm2:
    build:
      context: .
      dockerfile: Dockerfile.voxcpm2
      target: app
    image: read2me-voxcpm2
    container_name: read2me-voxcpm2
    ports:
      - "8003:8003"
    environment:
      - HF_HOME=/cache
      - UPLOAD_DIR=/uploads
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      - MODEL_ID=openbmb/VoxCPM2
      - OPTIMIZE=true
    volumes:
      - ./cache/voxcpm2:/cache
      - voxcpm2_uploads:/uploads
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest-gpu
    container_name: read2me-whisper
    ports:
      - "9000:9000"
    environment:
      - ASR_ENGINE=openai_whisper
      - ASR_MODEL=base.en
      - ASR_MODEL_PATH=/root/.cache/whisper
      - ASR_DEVICE=cuda
    volumes:
      - whisper_cache:/root/.cache/whisper
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  whisper-cpu:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: read2me-whisper-cpu
    ports:
      - "9001:9000"
    environment:
      - ASR_ENGINE=openai_whisper
      - ASR_MODEL=base.en
      - ASR_MODEL_PATH=/root/.cache/whisper
      - ASR_DEVICE=cpu
    volumes:
      - whisper_cpu_cache:/root/.cache/whisper
    restart: unless-stopped

  minilm-l6:
    build:
      context: .
      dockerfile: Dockerfile.minilm-l6
      target: runtime
    image: read2me-minilm-l6
    container_name: read2me-minilm-l6
    ports:
      - "8200:8200"
    environment:
      - SENTENCE_TRANSFORMERS_HOME=/cache/sentence-transformers
    volumes:
      - minilm_l6_cache:/cache
    restart: unless-stopped

  mpnet-base-v2:
    build:
      context: .
      dockerfile: Dockerfile.mpnet-base-v2
      target: runtime
    image: read2me-mpnet-base-v2
    container_name: read2me-mpnet-base-v2
    ports:
      - "8201:8201"
    environment:
      - SENTENCE_TRANSFORMERS_HOME=/cache/sentence-transformers
    volumes:
      - mpnet_base_v2_cache:/cache
    restart: unless-stopped

volumes:
  voxcpm2_uploads:
  whisper_cache:
  whisper_cpu_cache:
  minilm_l6_cache:
  mpnet_base_v2_cache:
