x-hardened: &hardened
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  pids_limit: 512
  dns: 127.0.0.1

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  llama:
    <<: [*hardened, *gpu]
    build:
      context: .
      dockerfile: Dockerfile.llama
      target: runtime
      args:
        CUDA_DOCKER_ARCH: "86"
    image: read2me-llama
    container_name: read2me-llama
    restart: unless-stopped
    networks: [llama]
    depends_on: [proxy]
    volumes:
      # Host GGUF directory. Override with GGUF_MODELS_DIR in Infra/.env to share
      # model files with other projects; container path stays /models.
      - ${GGUF_MODELS_DIR:-./models}:/models:ro
      - ./llama/config:/config:ro
      - ./logs:/logs
    # Exception: models.ini enables mlock so model pages stay resident.
    cap_add: [IPC_LOCK]
    ulimits:
      memlock: -1
    environment:
      LLAMA_HOST: 0.0.0.0
      LLAMA_PORT: 8080
      LLAMA_MODELS_FILE: /config/models.ini

  # audio.cpp: the single TTS runtime (ADR 0010; Apache-2.0 runtime, Breeze weights research/non-commercial).
  # Models in audiocpp/server.json (lazy-loaded, one resident): breeze-q8, breeze-design, voxcpm2, chatterbox, qwen3-base, qwen3-design.
  audiocpp:
    <<: [*hardened, *gpu]
    image: ghcr.io/0xshug0/audio.cpp:full-cuda12@sha256:05a2e7de7ac4b4730012beba471c684966f80b17da6d0ba7e8417caa8eceed39
    container_name: read2me-audiocpp
    restart: unless-stopped
    networks: [audiocpp]
    depends_on: [proxy]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - ${GGUF_MODELS_DIR:-./models}:/models:ro
      - ./audiocpp/server.json:/app/server.json:ro
    command: ["server", "--config", "/app/server.json"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  whisper:
    <<: *hardened
    build:
      context: .
      dockerfile: Dockerfile.whisper
      target: runtime
    image: read2me-whisper
    container_name: read2me-whisper
    user: "10001:10001"
    restart: unless-stopped
    networks: [whisper]
    depends_on: [proxy]
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --no-gpu
      - --threads
      - "4"
      - --model
      - /models/ggml-base.en.bin
    volumes:
      - ./models/ggml-base.en.bin:/models/ggml-base.en.bin:ro

  minilm-l6:
    <<: *hardened
    build:
      context: .
      dockerfile: Dockerfile.minilm-l6
      target: runtime
    image: read2me-minilm-l6
    container_name: read2me-minilm-l6
    restart: unless-stopped
    networks: [minilm-l6]
    depends_on: [proxy]
    environment:
      SENTENCE_TRANSFORMERS_HOME: /cache/sentence-transformers
    volumes:
      - ./cache/minilm-l6:/cache:ro

  mpnet-base-v2:
    <<: *hardened
    build:
      context: .
      dockerfile: Dockerfile.mpnet-base-v2
      target: runtime
    image: read2me-mpnet-base-v2
    container_name: read2me-mpnet-base-v2
    restart: unless-stopped
    networks: [mpnet-base-v2]
    depends_on: [proxy]
    environment:
      SENTENCE_TRANSFORMERS_HOME: /cache/sentence-transformers
    volumes:
      - ./cache/mpnet-base-v2:/cache:ro

  # The only container with egress: it publishes the five service ports and forwards each to
  # its service's internal network (proxy/nginx.conf; Infra/README.md, "Container egress").
  # Tag bumps are a hand edit; refresh-pins.ps1 refreshes the digest.
  proxy:
    <<: *hardened
    image: nginxinc/nginx-unprivileged:1.30-alpine-slim@sha256:5d8bb9437d74a600ec5dbf90c035451c724dc33eac8d3a71078f6f8612c345f6
    container_name: read2me-proxy
    restart: unless-stopped
    # nginx directly: the image's entrypoint scripts rewrite /etc/nginx, which is read-only here.
    entrypoint: ["nginx", "-g", "daemon off;"]
    networks: [edge, llama, audiocpp, whisper, minilm-l6, mpnet-base-v2]
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8004:8004"
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:8200:8200"
      - "127.0.0.1:8201:8201"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro

# Each service sits alone with the proxy on its own internal network: no default route, so no
# egress, not even to an IP literal. `edge` is the proxy's ordinary bridge, which carries the
# published ports. scripts/egress-check.ps1 proves the block.
networks:
  edge:
  llama:         { internal: true }
  audiocpp:      { internal: true }
  whisper:       { internal: true }
  minilm-l6:     { internal: true }
  mpnet-base-v2: { internal: true }
