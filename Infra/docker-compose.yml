x-hardened: &hardened
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  pids_limit: 512
  dns: 127.0.0.1

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  llama:
    <<: [*hardened, *gpu]
    build:
      context: .
      dockerfile: Dockerfile.llama
      target: runtime
      args:
        CUDA_DOCKER_ARCH: "86"
    image: read2me-llama
    container_name: read2me-llama
    restart: unless-stopped
    networks: [llama]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Host GGUF directory. Override with GGUF_MODELS_DIR in Infra/.env to share
      # model files with other projects; container path stays /models.
      - ${GGUF_MODELS_DIR:-./models}:/models:ro
      - ./llama/config:/config:ro
      - ./logs:/logs
    # Exception: models.ini enables mlock so model pages stay resident.
    cap_add: [IPC_LOCK]
    ulimits:
      memlock: -1
    environment:
      LLAMA_HOST: 0.0.0.0
      LLAMA_PORT: 8080
      LLAMA_MODELS_FILE: /config/models.ini
      LLAMA_DEFAULT_MODEL: gemma-26b

  # audio.cpp: the single TTS runtime (ADR 0010; Apache-2.0 runtime, Breeze weights research/non-commercial).
  # Models in audiocpp/server.json (lazy-loaded, one resident): breeze-q8, breeze-design, voxcpm2, chatterbox, qwen3-base, qwen3-design.
  audiocpp:
    <<: [*hardened, *gpu]
    image: ghcr.io/0xshug0/audio.cpp:full-cuda12@sha256:5969cc86637cad1e893c6c22120edda9d37fbe1f0f266702dbe7fe7b721ed125
    container_name: read2me-audiocpp
    restart: unless-stopped
    networks: [audiocpp]
    ports:
      - "127.0.0.1:8004:8080"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - ${GGUF_MODELS_DIR:-./models}:/models:ro
      - ./audiocpp/server.json:/app/server.json:ro
    command: ["server", "--config", "/app/server.json"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  whisper:
    <<: *hardened
    build:
      context: .
      dockerfile: Dockerfile.whisper
      target: runtime
    image: read2me-whisper
    container_name: read2me-whisper
    user: "10001:10001"
    restart: unless-stopped
    networks: [whisper]
    ports:
      - "127.0.0.1:9000:8080"
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --no-gpu
      - --threads
      - "4"
      - --model
      - /models/ggml-base.en.bin
    volumes:
      - ./models/ggml-base.en.bin:/models/ggml-base.en.bin:ro

  minilm-l6:
    <<: *hardened
    build:
      context: .
      dockerfile: Dockerfile.minilm-l6
      target: runtime
    image: read2me-minilm-l6
    container_name: read2me-minilm-l6
    restart: unless-stopped
    networks: [minilm-l6]
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      SENTENCE_TRANSFORMERS_HOME: /cache/sentence-transformers
    volumes:
      - ./cache/minilm-l6:/cache:ro

  mpnet-base-v2:
    <<: *hardened
    build:
      context: .
      dockerfile: Dockerfile.mpnet-base-v2
      target: runtime
    image: read2me-mpnet-base-v2
    container_name: read2me-mpnet-base-v2
    restart: unless-stopped
    networks: [mpnet-base-v2]
    ports:
      - "127.0.0.1:8201:8201"
    environment:
      SENTENCE_TRANSFORMERS_HOME: /cache/sentence-transformers
    volumes:
      - ./cache/mpnet-base-v2:/cache:ro

# One single-member bridge per hardened service prevents container-to-container reach.
networks:
  llama:
  audiocpp:
  whisper:
  minilm-l6:
  mpnet-base-v2:
