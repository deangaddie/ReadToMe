# SCRATCH probe compose for .scratch/infra-hardening issue 10 — not the real stack.
# Run with: docker compose -f docker-compose.harden.yml -p probe up -d <service>
#
# Carries, together: the least-privilege block (03), loopback+per-service bridge (02),
# the offline posture (07: dns blackhole, HF offline env, :ro caches) and the slimmed
# probe images (09). Every service also gets the probe Dockerfile with USER app (10001).

x-hardened: &hardened
  restart: "no"
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  pids_limit: 512
  dns: 127.0.0.1

x-offline: &offline
  HF_HUB_OFFLINE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  DO_NOT_TRACK: "1"

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  llama:
    <<: [*hardened, *gpu]
    build:
      context: .
      dockerfile: probe/Dockerfile.llama
      target: runtime
      args:
        CUDA_DOCKER_ARCH: "86"
    image: probe-llama
    container_name: probe-llama
    networks: [llama]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./models:/models:ro
      - ./llama/config:/config:ro
      - ./logs:/logs
    # Exception (issue 05): models.ini [*] sets mlock = true.
    cap_add: [IPC_LOCK]
    ulimits:
      memlock: -1
    environment:
      LLAMA_HOST: 0.0.0.0
      LLAMA_PORT: 8080
      LLAMA_MODELS_FILE: /config/models.ini
      LLAMA_DEFAULT_MODEL: gemma-4b

  chatterbox:
    <<: [*hardened, *gpu]
    build:
      context: .
      dockerfile: probe/Dockerfile.chatterbox
    image: probe-chatterbox
    container_name: probe-chatterbox
    networks: [chatterbox]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      <<: *offline
      HF_HOME: /cache
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      # EXCEPTION (finding 1): librosa jits with @jit(cache=True); numba writes the cache
      # beside the module in site-packages → fatal under read_only. Redirect it to the tmpfs.
      NUMBA_CACHE_DIR: /tmp/numba
    volumes:
      - ./cache/chatterbox:/cache:ro

  chatterbox-turbo:
    <<: [*hardened, *gpu]
    build:
      context: .
      dockerfile: probe/Dockerfile.chatterbox
      args:
        APP_MODULE: app_turbo
    image: probe-chatterbox-turbo
    container_name: probe-chatterbox-turbo
    networks: [chatterbox-turbo]
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      <<: *offline
      HF_HOME: /cache
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      NUMBA_CACHE_DIR: /tmp/numba
    volumes:
      - ./cache/chatterbox-turbo:/cache:ro

  qwen3-tts:
    <<: [*hardened, *gpu]
    build:
      context: .
      dockerfile: probe/Dockerfile.qwen3
    image: probe-qwen3-tts
    container_name: probe-qwen3-tts
    networks: [qwen3-tts]
    ports:
      - "127.0.0.1:8100:8100"
    environment:
      <<: *offline
      HF_HOME: /cache
      NUMBA_CACHE_DIR: /tmp/numba
    volumes:
      - ./cache/qwen3:/cache:ro

  qwen3-tts-base:
    <<: [*hardened, *gpu]
    build:
      context: .
      dockerfile: probe/Dockerfile.qwen3
      args:
        APP_MODULE: app_base
        APP_PORT: "8101"
    image: probe-qwen3-tts-base
    container_name: probe-qwen3-tts-base
    networks: [qwen3-tts-base]
    ports:
      - "127.0.0.1:8101:8101"
    environment:
      <<: *offline
      HF_HOME: /cache
      NUMBA_CACHE_DIR: /tmp/numba
      APP_PORT: "8101"
    volumes:
      - ./cache/qwen3-base:/cache:ro

  voxcpm2:
    <<: [*hardened, *gpu]
    build:
      context: .
      dockerfile: probe/Dockerfile.voxcpm2
      target: app
    image: probe-voxcpm2
    container_name: probe-voxcpm2
    networks: [voxcpm2]
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      <<: *offline
      HF_HOME: /cache
      NUMBA_CACHE_DIR: /tmp/numba
      # EXCEPTION (finding 3): OPTIMIZE=true runs torch.compile, whose triton/inductor
      # backends JIT-compile kernels into $HOME/.triton and $HOME/.cache — fatal under
      # read_only. Redirect both onto the tmpfs.
      TRITON_CACHE_DIR: /tmp/triton
      TORCHINDUCTOR_CACHE_DIR: /tmp/inductor
      XDG_CACHE_HOME: /tmp/xdg
      UPLOAD_DIR: /uploads
      PYTORCH_CUDA_ALLOC_CONF: max_split_size_mb:512
      MODEL_ID: openbmb/VoxCPM2
      OPTIMIZE: "true"
    volumes:
      - ./cache/voxcpm2:/cache:ro
      - probe_voxcpm2_uploads:/uploads

  minilm-l6:
    <<: *hardened
    build:
      context: .
      dockerfile: probe/Dockerfile.minilm-l6
      target: runtime
    image: probe-minilm-l6
    container_name: probe-minilm-l6
    networks: [minilm-l6]
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      <<: *offline
      SENTENCE_TRANSFORMERS_HOME: /cache/sentence-transformers
    volumes:
      - ./cache/minilm-l6:/cache:ro

  mpnet-base-v2:
    <<: *hardened
    build:
      context: .
      dockerfile: probe/Dockerfile.mpnet-base-v2
      target: runtime
    image: probe-mpnet-base-v2
    container_name: probe-mpnet-base-v2
    networks: [mpnet-base-v2]
    ports:
      - "127.0.0.1:8201:8201"
    environment:
      <<: *offline
      SENTENCE_TRANSFORMERS_HOME: /cache/sentence-transformers
    volumes:
      - ./cache/mpnet-base-v2:/cache:ro

volumes:
  probe_voxcpm2_uploads:

# One single-member bridge per service (issue 02) — no container↔container reach.
networks:
  llama:
  chatterbox:
  chatterbox-turbo:
  qwen3-tts:
  qwen3-tts-base:
  voxcpm2:
  minilm-l6:
  mpnet-base-v2:
