# Model presets for llama-server
# Switch models without restart via autoload: name the target model in an inference request
# (e.g. POST /v1/chat/completions with {"model":"gemma-26b"}). --models-max 1 evicts the currently
# loaded model. NOTE: POST /v1/models does NOT switch models on this pinned fork build (it 404s).
# Probe which preset is loaded with GET /v1/models — each item's status.value is unloaded/loading/loaded.
# See: https://github.com/ggml-org/llama.cpp/blob/master/examples/server/README.md#model-presets

[*]
no-mmap = true
mlock = true
t = 6
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.1
# Trial: fork README's recommended KV pair (step 3) in place of symmetric turbo
# (step 6, "Discouraged: never lead with a turbo K"). Revert to the two commented
# lines below if fidelity or VRAM disappoints.
ctk = turbo4
ctv = turbo3
# ctk = q8_0
# ctv = turbo3
jinja = true
parallel = 1
top-p = 0.95

[gemma-4b]
c = 8096
b = 2048
ub = 1024
reasoning-budget = 1024
model = /models/gemma-4-E4B-it-UD-Q4_K_XL.gguf
alias = gemma4b-it
ngl = 999
temp = 0.4
top-k = 64
presence-penalty = 0.3
repeat-penalty = 1.3
ctk = q8_0
ctv = q8_0
cache-reuse = 256

[gemma-12b_QAT]
c = 8096
