# Model presets for llama-server
# Switch models without restart via autoload: name the target model in an inference request
# (e.g. POST /v1/chat/completions with {"model":"qwen-28b"}). --models-max 1 evicts the currently
# loaded model. NOTE: POST /v1/models 404ed on the old fork build; autoload is the switch the app uses.
# Probe which preset is loaded with GET /v1/models — each item's status.value is unloaded/loading/loaded.
# See: https://github.com/ggml-org/llama.cpp/blob/master/examples/server/README.md#model-presets

[*]
# load-mode = mlock (no mmap, weights locked): mmap over the virtiofs models mount faulted at ~44 MB/s (389 s
# cold load vs 106 s sequential read, past the app's 300 s model-switch budget), and
# llama warns against mmap when n-cpu-moe overrides tensors to CPU. Measured 2026-07-23.
load-mode = mlock
# No host-RAM prompt cache — it grew unbounded (default 8 GiB) and OOM-killed the
# WSL2 VM; slot-level (GPU KV) prompt reuse is unaffected. See
# .scratch/llama-memory/evidence/investigation.md
cache-ram = 0
t = 6
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.1
# q8_0 K and V with upstream's default KV rotation (attn_rot_k/v = 1). The fork's turbo3 V
# does not exist upstream (the preset fails to load). qwen-28b KV = 332 MiB, 7.4 of 8 GB VRAM.
ctk = q8_0
ctv = q8_0
jinja = true
parallel = 1
top-p = 0.95

[gemma-4b]
c = 8096
b = 2048
ub = 1024
reasoning-budget = 1024
model = /models/gemma-4-E4B-it-UD-Q4_K_XL.gguf
alias = gemma4b-it
ngl = 999
temp = 0.4
top-k = 64
presence-penalty = 0.3
repeat-penalty = 1.3
ctk = q8_0
ctv = q8_0
cache-reuse = 256

[gemma-12b_QAT]
c = 8096
b = 2048
ub = 1024
reasoning-budget = 1024
model = /models/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
alias = gemma12-qat-it
ngl = 999
temp = 1.0
top-k = 64
n-cpu-moe = 28

[lamma-3.1-8b]
c = 16000
model = /models/Llama-3.1-8B-Instruct-Q6_K.gguf
alias = lamma-3.1-3b
temp = 1.0
top-k = 20

[lamma-3.2-3b]
c = 16000
model = /models/Llama-3.2-3B-Instruct-Q8_0.gguf
alias = lamma-3.2-3b
temp = 1.0
top-k = 20

[qwen-4b]
c = 8096
b = 2048
ub = 1024
reasoning-budget = 1024
model = /models/Qwen3.5-4B-UD-Q4_K_XL.gguf
alias = qwen4b
ngl = 0
temp = 0.4
top-k = 20
ctk = f16
ctv = f16
cache-reuse = 0

[qwen-9b]
c = 8096
b = 2048
ub = 1024
reasoning-budget = 1024
model = /models/Qwen3.5-9B-UD-Q4_K_XL.gguf
alias = qwen9b
ngl = 999
temp = 0.4
top-k = 20
presence-penalty = 1.2
repeat-penalty = 1.0
ctk = q8_0
ctv = q8_0
cache-reuse = 256

# Attribution preset (llm-model-upgrade ticket 23, 2026-09-30); was the bench's qwen-28b-vendor.
# Thinking on/off is decided per request by the app (chat_template_kwargs enable_thinking): off for
# attribution step 1 + voice prompts, on for the chain's thinking step + voice plans (+ discovery when toggled).
# Sampling per mode lives in the app's LLM configs (vendor: thinking off 0.7/0.8/presence 1.5, thinking on
# 1.0/0.95/1.5); the values here are the fallback. reasoning-budget 4096 caps thinking runaways (ticket 22:
# 0 cap hits in 5 runs vs ~1 per 2 unbounded, same quality). b/ub/n-cpu-moe are ticket 19's Stage A winners.
[qwen-28b]
c = 32000
model = /models/Qwen3.6-28B-REAP20-A3B-Q4_K_M.gguf
alias = qwen28-reap
ngl = 999
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0.0
repeat-penalty = 1.0
n-cpu-moe = 30
b = 2048
ub = 2048
reasoning-budget = 4096

# Chapter-pass attribution preset (attribution-grammar 01, 2026-10-03): a verbatim copy of the attribution-options
# spike's [gemma-12b-bench]. 16k ctx fits the whole-chapter-so-far prompt (the app trims long chapters to ~40k
# chars). The app forces temperature 0 (and thinking off, max_tokens 48) per request on the Chapter prompt style,
# so temp below is only the fallback. repeat-penalty 1.0 overrides [*]'s 1.1, as in the spike.
[gemma-12b]
c = 16384
b = 2048
ub = 1024
model = /models/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
ngl = 999
temp = 1.0
top-p = 0.95
top-k = 64
repeat-penalty = 1.0
