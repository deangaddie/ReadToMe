# Deliberately standalone: do not merge with docker-compose.yml. The hardened
# compose blackholes DNS, which prevents these one-shot cache population jobs.
services:
  whisper:
    image: read2me-whisper
    user: "0:0"
    volumes:
      - ./models:/models
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        manifest=/models/whisper-models.sha256
        test -f "$$manifest"

        value() {
          sed -n "s/^$$1=//p" "$$manifest" | head -n 1
        }

        filename=$$(value Filename)
        revision=$$(value SourceRevision)
        source_url=$$(value SourceUrl)
        expected_sha256=$$(value SHA256)
        expected_length=$$(value ByteLength)

        test "$$filename" = ggml-base.en.bin
        test -n "$$revision"
        test "$$source_url" != "$${source_url#*"$$revision"*}"
        test "$${#expected_sha256}" -eq 64
        expected_sha256=$$(printf %s "$$expected_sha256" | tr '[:upper:]' '[:lower:]')
        case "$$expected_sha256" in *[!0123456789abcdef]*) exit 1 ;; esac
        case "$$expected_length" in ''|*[!0-9]*) exit 1 ;; esac

        destination=/models/$$filename
        is_valid() {
          test -f "$$1" &&
            test "$$(wc -c < "$$1" | tr -d ' ')" = "$$expected_length" &&
            test "$$(sha256sum "$$1" | awk '{print $$1}')" = "$$expected_sha256"
        }

        if is_valid "$$destination"; then
          echo "Verified existing Whisper model: $$destination"
          exit 0
        fi

        temporary=$$(mktemp /models/."$$filename".XXXXXX.tmp)
        trap 'rm -f "$$temporary"' EXIT
        echo "Downloading Whisper model revision $$revision..."
        curl --fail --location --proto '=https' --tlsv1.2 --output "$$temporary" "$$source_url"
        is_valid "$$temporary"
        mv -f "$$temporary" "$$destination"
        trap - EXIT
        echo "Provisioned verified Whisper model: $$destination"

  chatterbox:
    image: read2me-chatterbox
    environment:
      HF_HOME: /cache
    volumes:
      - ./cache/chatterbox:/cache
    command:
      - hf
      - download
      - ResembleAI/chatterbox
      - --revision
      - 5bb1f6ee58e50c3b8d408bc82a6d3740c2db6e18
      - --cache-dir
      - /cache

  chatterbox-turbo:
    image: read2me-chatterbox-turbo
    environment:
      HF_HOME: /cache
    volumes:
      - ./cache/chatterbox-turbo:/cache
    command:
      - hf
      - download
      - ResembleAI/chatterbox-turbo
      - --revision
      - 749d1c1a46eb10492095d68fbcf55691ccf137cd
      - --cache-dir
      - /cache

  qwen3-tts:
    image: read2me-qwen3-tts
    environment:
      HF_HOME: /cache
    volumes:
      - ./cache/qwen3:/cache
    command:
      - python
      - -c
      - |
        from huggingface_hub import snapshot_download
        snapshot_download("Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign", revision="5ecdb67327fd37bb2e042aab12ff7391903235d3", cache_dir="/cache")

  qwen3-tts-base:
    image: read2me-qwen3-tts-base
    environment:
      HF_HOME: /cache
    volumes:
      - ./cache/qwen3-base:/cache
    command:
      - python
      - -c
      - |
        from huggingface_hub import snapshot_download
        snapshot_download("Qwen/Qwen3-TTS-12Hz-1.7B-Base", revision="fd4b254389122332181a7c3db7f27e918eec64e3", cache_dir="/cache")

  voxcpm2:
    image: read2me-voxcpm2
    environment:
      HF_HOME: /cache
      MODEL_ID: /cache/hub/models--openbmb--VoxCPM2/snapshots/bffb3df5a29440629464e5e839f4d214c8714c3d
    volumes:
      - ./cache/voxcpm2:/cache
    command:
      - python
      - -c
      - |
        from pathlib import Path
        from huggingface_hub import snapshot_download
        path = Path(snapshot_download("openbmb/VoxCPM2", revision="bffb3df5a29440629464e5e839f4d214c8714c3d", cache_dir="/cache"))
        expected = Path("/cache/hub/models--openbmb--VoxCPM2/snapshots/bffb3df5a29440629464e5e839f4d214c8714c3d")
        if path != expected:
            raise RuntimeError(f"expected {expected}, got {path}")

  minilm-l6:
    image: read2me-minilm-l6
    environment:
      SENTENCE_TRANSFORMERS_HOME: /cache/sentence-transformers
    volumes:
      - ./cache/minilm-l6:/cache
    command:
      - python
      - -c
      - |
        from sentence_transformers import SentenceTransformer
        SentenceTransformer("sentence-transformers/all-MiniLM-L6-v2", revision="1110a243fdf4706b3f48f1d95db1a4f5529b4d41", cache_folder="/cache/sentence-transformers")

  mpnet-base-v2:
    image: read2me-mpnet-base-v2
    environment:
      SENTENCE_TRANSFORMERS_HOME: /cache/sentence-transformers
    volumes:
      - ./cache/mpnet-base-v2:/cache
    command:
      - python
      - -c
      - |
        from sentence_transformers import SentenceTransformer
        SentenceTransformer("sentence-transformers/all-mpnet-base-v2", revision="e8c3b32edf5434bc2275fc9bab85f82640a19130", cache_folder="/cache/sentence-transformers")
